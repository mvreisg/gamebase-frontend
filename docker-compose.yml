services:
  app:
    build: .
    container_name: gamebase-frontend
    volumes:
      - .:/var/www/html
    networks:
      - gamebase-frontend-network

  nginx:
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "8081:8081"
    volumes:
      - .:/var/www/html
      - ./default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - gamebase-frontend-network

networks:
  gamebase-frontend-network:
    driver: bridge
